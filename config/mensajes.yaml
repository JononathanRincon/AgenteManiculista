# Todo el texto que ve la clienta. Español colombiano, tuteando. Las {variables} no se tocan.
# Límites de WhatsApp: botones y botón de lista hasta 20 caracteres, títulos de fila hasta 24.

# --- Aviso de tratamiento de datos (Ley 1581 de 2012) ---
# BORRADOR: pendiente de revisión legal antes de salir a producción (PA-07).
aviso_datos: >-
  Hola 👋 Soy la asistente de agenda de {negocio}. Para agendar tu cita necesito tu número de
  WhatsApp y el nombre de tu perfil (y tu dirección si pides domicilio). Los uso solo para
  gestionar tus citas, según la Ley 1581 de 2012, y puedes pedir que los borre cuando quieras.
  ¿Aceptas?
boton_acepto: "Acepto"
boton_no_acepto: "No acepto"
aviso_rechazado: >-
  Entendido, no guardaré tus datos. Si cambias de opinión, escríbeme de nuevo cuando quieras.

# --- Menú ---
bienvenida: "¡Hola{nombre}! 💅 ¿En qué te puedo ayudar?"
menu_cuerpo: "Elige una opción:"
menu_agendar: "Agendar cita"
menu_consultar: "Ver servicios"
menu_gestionar: "Mis citas"
no_entendi: "No te entendí del todo 🙈. Elige una opción:"
no_texto: "Por ahora solo entiendo mensajes de texto 🙂. Elige una opción:"
error_generico: "Tuve un problema técnico. Intenta de nuevo en un momento, por favor 🙏"

