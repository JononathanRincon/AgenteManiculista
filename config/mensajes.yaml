cita_confirmada_domicilio: >-
  ✅ ¡Cita confirmada! {servicio}, {fecha} a las {hora}, a domicilio en {direccion}.
horario_ocupado: "Ese horario se acaba de ocupar 😕. Mira estas otras opciones:"
cita_fallida: >-
  No pude confirmar tu cita porque el horario ya no está libre. Tu horario quedó liberado; escríbeme
  y buscamos otro 🙏
cita_expirada: "Tu reserva venció porque no se alcanzó a confirmar. Escríbeme y la hacemos de nuevo 🙏"
limite_citas: >-
  Ya tienes {maximo} citas próximas. Puedes reagendar o cancelar una de ellas:

