[project]
name = "agente-manicurista"
version = "0.1.0"
description = "Agente de agendamiento por WhatsApp para manicurista independiente (el LLM interpreta, el código ejecuta)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# E/F: errores base, I: imports, B: bugbear, UP: pyupgrade, C90: complejidad, S: seguridad, SIM: simplificación
select = ["E", "F", "I", "B", "UP", "C90", "S", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert es la herramienta de aserción en pytest

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
